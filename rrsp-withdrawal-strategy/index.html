      <h1>RRSP Withdrawal Strategy Calculator</h1>
      <p>
        A free calculator for planning RRSP withdrawals in retirement — the RRSP meltdown
        strategy. Deferring an RRSP as long as possible often backfires: mandatory RRIF minimum
        withdrawals (starting the year you turn 72, after converting your RRSP to a RRIF by the
        end of the year you turn 71) stack on top of CPP and OAS, push you into higher tax
        brackets, trigger the OAS clawback, and leave whatever remains fully taxable as income at
        death. A meltdown deliberately draws the RRSP down in low-income years at low tax rates.
        This tool simulates your retirement year by year — real federal and provincial tax, OAS
        clawback, and RRIF minimums — and searches for the decumulation schedule that leaves the
        largest after-tax estate without running you short. Everything runs locally in your
        browser; your data never leaves your device. This is educational information, not
        financial advice. JavaScript is required to use the calculator.
      </p>
