name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Overlapping pushes must not race the gh-pages branch — run one deploy at a
# time and drop superseded runs
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the runtime that builds the deployed site. Without this the job runs
      # on whatever Node the ubuntu-latest image happens to ship, which drifts
      # independently of the dev container — keep this in step with Dockerfile.dev.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install, Test and Build
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
