name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Lets a video-only update be deployed by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Overlapping pushes must not race the gh-pages branch — run one deploy at a
# time and drop superseded runs
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Pinned rather than ubuntu-latest so a runner-image migration can't change
    # the build environment unannounced; bump it deliberately.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the runtime that builds the deployed site. Without this the job runs
      # on whatever Node the runner image happens to ship, which drifts
      # independently of the dev container — keep this in step with Dockerfile.dev.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install, Test and Build
        run: |
          npm ci
          npm test
          npm run build

      # The tutorial videos are too big for git. They live as attachments on the
      # `tutorial-videos` release and are copied in next to /tutorials/index.html.
      # dist/tutorials already exists from the build and holds no MP4s, so no
      # --clobber is needed.
      - name: Download tutorial videos
        run: gh release download tutorial-videos --pattern '*.mp4' --dir dist/tutorials
        env:
          GH_TOKEN: ${{ github.token }}

      # Fail the deploy if a video the tutorials page lists isn't in the release
      - name: Check tutorial videos
        run: node scripts/check-tutorial-videos.mjs dist

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # gh-pages only ever needs the latest site; squashing it to one commit
          # keeps the videos and old builds from piling up in its history.
          single-commit: true
