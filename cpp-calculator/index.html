      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on how much you earned and for how long. The maximum base pension at 65 is about $17,300 a year — roughly $1,440 a month in 2026 — but reaching it takes close to 40 years of earning at or above the annual ceiling (the YMPE), which most people never do. Because of gaps, lower-earning years, and part-time work, many retirees receive around half the maximum or less. This calculator scores your own earnings history and shows what share of the maximum you qualify for."

      "name": "When can I start CPP?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Any time between 60 and 70. Starting before 65 permanently reduces your pension by 0.6% for each month early — take it at 60 and that is 36% less. Waiting past 65 permanently increases it by 0.7% for each month you defer, so starting at 70 pays 42% more. There is no benefit to waiting beyond 70. The Benefit by Start Age chart on this page shows your own amount at every age from 60 to 70."
      }
    },

      }

      "name": "How is CPP actually calculated?",
      "acceptedAnswer": {
        "@type": "Answer",

      }

        "@type": "Answer",
